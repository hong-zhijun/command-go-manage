<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Go Manage</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --border: #e5e8ed;
    --border-light: #eef0f4;
    --text: #1a1a2e;
    --text-dim: #6b7280;
    --text-bright: #111827;
    --accent: #4f6ef7;
    --accent-light: #eef1fe;
    --accent-hover: #3b5de7;
    --green: #10b981;
    --green-light: #ecfdf5;
    --green-hover: #059669;
    --red: #ef4444;
    --red-light: #fef2f2;
    --yellow: #f59e0b;
    --yellow-light: #fffbeb;
    --orange: #f97316;
    --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 导航栏 ── */
  .navbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .brand { font-size: 17px; font-weight: 700; color: var(--text-bright); display: flex; align-items: center; gap: 8px; }
  .brand-icon { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #818cf8); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
  .brand span { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-user { font-size: 13px; color: var(--text-dim); padding: 4px 10px; background: var(--surface2); border-radius: 6px; }
  .nav-btn { padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); font-weight: 500; transition: all .15s; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .nav-btn.danger { color: var(--red); border-color: var(--border); }
  .nav-btn.danger:hover { border-color: var(--red); background: var(--red-light); }

  /* ── 页面容器 ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 28px 32px; }

  /* ── 登录页 ── */
  #login-page { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg); }
  .login-card { background: var(--surface); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); }
  .login-card h2 { font-size: 22px; color: var(--text-bright); margin-bottom: 6px; text-align: center; font-weight: 700; }
  .login-subtitle { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 13px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .form-group input::placeholder { color: #c0c5ce; }
  .btn-primary { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 14px; text-align: center; display: none; }

  /* ── 仪表板 ── */
  #app-page { display: none; }
  .tabs { display: flex; gap: 2px; margin-bottom: 24px; background: var(--surface); border-radius: 10px; padding: 4px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); width: fit-content; }
  .tab { padding: 8px 20px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-dim); border-radius: 7px; transition: all .15s; user-select: none; }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { color: var(--accent); background: var(--accent-light); font-weight: 600; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── 统计卡片 ── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); transition: box-shadow .15s; }
  .stat-card:hover { box-shadow: var(--shadow); }
  .stat-card .stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 500; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; color: var(--text-bright); line-height: 1.1; }
  .stat-card .stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* ── 通用卡片 ── */
  .card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .card h3 { font-size: 16px; color: var(--text-bright); margin-bottom: 4px; font-weight: 600; }
  .card .card-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-header h3 { margin-bottom: 0; }

  /* ── 图表区域 ── */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
  .chart-card h4 { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 12px; }
  .chart-wrap { position: relative; height: 220px; }

  /* ── 池健康概览 ── */
  .pool-health { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .pool-item { text-align: center; padding: 12px 8px; border-radius: 8px; background: var(--surface2); }
  .pool-num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .pool-lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .pool-num.green { color: var(--green); }
  .pool-num.red { color: var(--red); }
  .pool-num.yellow { color: #b45309; }
  .pool-num.accent { color: var(--accent); }

  /* ── 范围切换 ── */
  .range-tabs { display: flex; gap: 2px; background: var(--surface2); border-radius: 6px; padding: 2px; font-size: 12px; }
  .range-tab { padding: 4px 12px; border-radius: 5px; cursor: pointer; color: var(--text-dim); font-weight: 500; transition: all .15s; }
  .range-tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); font-weight: 600; }

  /* ── 表格 ── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--surface2); }
  th { text-align: left; padding: 10px 14px; color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  th:first-child { border-radius: 8px 0 0 8px; }
  th:last-child { border-radius: 0 8px 8px 0; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border-light); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }
  .mono { font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 12px; color: var(--accent); }

  /* ── 分页 ── */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; font-size: 13px; }
  .pagination button { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer; font-size: 12px; transition: all .15s; }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: .4; cursor: not-allowed; }
  .pagination span { color: var(--text-dim); }

  /* ── 筛选栏 ── */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .filter-row select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; outline: none; }
  .filter-row select:focus { border-color: var(--accent); }

  /* ── 进度条 ── */
  .progress-bar { height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-bar .fill { height: 100%; border-radius: 4px; transition: width .3s; }
  .fill.green { background: var(--green); }
  .fill.yellow { background: var(--yellow); }
  .fill.red { background: var(--red); }

  /* ── 输入行 ── */
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .input-row input { flex: 1; min-width: 160px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .input-row input::placeholder { color: #c0c5ce; }
  .btn-action { padding: 9px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
  .btn-action:hover { background: var(--accent-hover); }
  .btn-secondary { padding: 9px 18px; border-radius: 8px; background: var(--surface); color: var(--text-dim); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; border: 1px solid var(--border); transition: all .15s; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ── CC Key 卡片网格 ── */
  .key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .key-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); transition: box-shadow .15s; }
  .key-card:hover { box-shadow: var(--shadow-md); }
  .key-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .key-head-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .key-label { font-size: 15px; font-weight: 600; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .key-sub { font-size: 13px; color: var(--text-dim); font-family: 'SF Mono', Monaco, monospace; margin-bottom: 16px; line-height: 1.4; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .badge.active { background: var(--green-light); color: var(--green); }
  .badge.error { background: var(--red-light); color: var(--red); }
  .badge.exhausted { background: var(--yellow-light); color: #b45309; }

  /* ── CC Key 额度窗口 ── */
  .quota-section { margin-bottom: 14px; }
  .quota-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 5px; }
  .quota-label { color: var(--text-dim); font-weight: 500; }
  .quota-value { color: var(--text-bright); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── CC Key 用量统计 ── */
  .usage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light); }
  .usage-item { text-align: center; }
  .usage-num { font-size: 18px; font-weight: 700; color: var(--text-bright); line-height: 1.2; }
  .usage-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* ── CC Key 底部信息 ── */
  .key-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-light); }

  /* ── 调度控制 ── */
  .dispatch-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light); }
  .dispatch-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .dispatch-title .arrow { transition: transform .15s; font-size: 10px; }
  .dispatch-title .arrow.open { transform: rotate(90deg); }
  .dispatch-body { display: none; }
  .dispatch-body.open { display: block; }
  .dispatch-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .dispatch-row label { color: var(--text-dim); font-weight: 500; min-width: 80px; font-size: 12px; }
  .dispatch-row input[type="number"] { width: 72px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; outline: none; font-variant-numeric: tabular-nums; }
  .dispatch-row input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
  .dispatch-row select { flex: 1; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; outline: none; }
  .dispatch-row select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
  .btn-save-dispatch { padding: 5px 14px; border-radius: 6px; font-size: 12px; border: 1px solid var(--green); background: var(--green-light); color: var(--green); cursor: pointer; font-weight: 500; transition: all .15s; margin-top: 4px; }
  .btn-save-dispatch:hover { background: var(--green); color: #fff; }
  .btn-save-dispatch:disabled { opacity: .5; cursor: not-allowed; }

  /* ── 设备指纹摘要 ── */
  .device-section { margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 8px; }
  .device-title { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 12px; }
  .device-grid dt { color: var(--text-dim); }
  .device-grid dd { color: var(--text); font-weight: 500; margin: 0; }

  /* ── 新 Key 提示 ── */
  .key-banner { display: none; background: var(--green-light); border: 1px solid #a7f3d0; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .key-banner strong { color: var(--green); font-size: 13px; }
  .key-banner code { display: block; margin-top: 6px; padding: 8px 10px; background: #fff; border-radius: 6px; font-size: 12px; word-break: break-all; color: var(--text-bright); border: 1px solid #d1fae5; }
  .key-banner .warn { display: block; margin-top: 6px; font-size: 11px; color: #b45309; }

  /* ── 小按钮 ── */
  .btn-sm { padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); transition: all .15s; }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .btn-sm.danger { color: var(--text-dim); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

  /* ── 标签编辑 ── */
  .label-edit { display: inline-flex; align-items: center; gap: 4px; }
  .label-edit .btn-edit-label { border: none; background: none; cursor: pointer; color: var(--text-dim); font-size: 12px; padding: 2px 4px; border-radius: 4px; transition: all .15s; }
  .label-edit .btn-edit-label:hover { color: var(--accent); background: var(--accent-light); }

  /* ── 空状态 ── */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; }

  /* ── 骨架屏 ── */
  .skeleton { background: linear-gradient(90deg, var(--surface2) 25%, #e8eaef 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-line { height: 14px; margin-bottom: 10px; }
  .skeleton-block { height: 220px; }

  /* ── 状态点 ── */
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .status-dot.ok { background: var(--green); }
  .status-dot.error { background: var(--red); }

  /* ── Toast 通知 ── */
  .toast-container { position: fixed; top: 68px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md); animation: toastIn .25s ease-out; display: flex; align-items: center; gap: 8px; max-width: 360px; }
  .toast.success { background: var(--green-light); color: #065f46; border: 1px solid #a7f3d0; }
  .toast.error { background: var(--red-light); color: #991b1b; border: 1px solid #fca5a5; }
  .toast.info { background: var(--accent-light); color: #1e3a8a; border: 1px solid #bfdbfe; }
  .toast.fadeout { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

  /* ── 按钮 loading ── */
  .btn-action:disabled, .btn-secondary:disabled { opacity: .6; cursor: not-allowed; pointer-events: none; }

  /* ── 响应式 ── */
  @media (max-width: 768px) {
    .chart-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .navbar { padding: 0 16px; }
    .container { padding: 16px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .key-grid { grid-template-columns: 1fr; }
    .tabs { overflow-x: auto; width: auto; }
    .tab { padding: 8px 14px; font-size: 12px; }
    .login-card { padding: 28px 24px; margin: 0 16px; }
    .chart-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ── 登录页 ── -->
<div id="login-page">
  <div class="login-card">
    <h2>Command Go</h2>
    <p class="login-subtitle">代理管理平台</p>
    <div class="form-group">
      <label>用户名</label>
      <input id="login-user" type="text" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">登录</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── 主界面 ── -->
<div id="app-page">
  <nav class="navbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      Command <span>Go</span>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="nav-username"></span>
      <button class="nav-btn danger" onclick="doLogout()">退出登录</button>
    </div>
  </nav>

  <div class="container">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="overview">概览</div>
      <div class="tab" data-tab="keys">API Key</div>
      <div class="tab" data-tab="cc-pool">CC Key 池</div>
      <div class="tab" data-tab="logs">请求日志</div>
    </div>

    <!-- ═══ 概览 ═══ -->
    <div class="tab-content active" id="tab-overview">
      <div class="stat-grid" id="stats-grid">
        <div class="stat-card"><div class="skeleton skeleton-line" style="width:60%"></div><div class="skeleton skeleton-line" style="width:40%;height:26px"></div></div>
        <div class="stat-card"><div class="skeleton skeleton-line" style="width:60%"></div><div class="skeleton skeleton-line" style="width:40%;height:26px"></div></div>
        <div class="stat-card"><div class="skeleton skeleton-line" style="width:60%"></div><div class="skeleton skeleton-line" style="width:40%;height:26px"></div></div>
        <div class="stat-card"><div class="skeleton skeleton-line" style="width:60%"></div><div class="skeleton skeleton-line" style="width:40%;height:26px"></div></div>
      </div>

      <!-- 图表时间范围选择 -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font-size:16px;font-weight:600;color:var(--text-bright)">数据趋势</h3>
        <div class="range-tabs" id="chart-range">
          <div class="range-tab" data-range="24h">24 小时</div>
          <div class="range-tab active" data-range="7d">7 天</div>
          <div class="range-tab" data-range="30d">30 天</div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h4>📈 请求趋势</h4>
          <div class="chart-wrap"><canvas id="chart-calls"></canvas></div>
        </div>
        <div class="chart-card">
          <h4>🔤 Token 消耗</h4>
          <div class="chart-wrap"><canvas id="chart-tokens"></canvas></div>
        </div>
        <div class="chart-card">
          <h4>🧩 模型分布</h4>
          <div class="chart-wrap"><canvas id="chart-models"></canvas></div>
        </div>
        <div class="chart-card">
          <h4>🏊 CC Key 池健康</h4>
          <div id="pool-health-wrap" class="pool-health" style="padding-top:20px">
            <div class="skeleton skeleton-block" style="height:120px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ 我的 API Key ═══ -->
    <div class="tab-content" id="tab-keys">
      <div class="card">
        <h3>我的 API Key</h3>
        <p class="card-desc">使用这些 Key 调用 <code>/v1/chat/completions</code> 等代理接口</p>
        <div class="input-row">
          <input id="key-name-input" placeholder="Key 名称（可选）">
          <button class="btn-action" onclick="createKey()">+ 创建 Key</button>
        </div>
        <div class="key-banner" id="new-key-banner">
          <strong>✓ 新 Key 已创建</strong>
          <code id="new-key-value"></code>
          <span class="warn">⚠ 请立即复制保存，此 Key 不会再次显示</span>
        </div>
        <table>
          <thead><tr><th>名称</th><th>Key 前缀</th><th>调用次数</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="keys-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ═══ CC Key 池 ═══ -->
    <div class="tab-content" id="tab-cc-pool">
      <div class="card">
        <h3>CC Key 池</h3>
        <p class="card-desc">管理底层 CC 密钥，系统自动负载均衡分配</p>
        <div class="input-row">
          <input id="cc-key-input" placeholder="user_xxxxxxxxx（CC 原始 Key）">
          <input id="cc-label-input" placeholder="备注（可选）" style="max-width:200px">
          <button class="btn-action" onclick="addCcKey()">+ 添加</button>
          <button class="btn-secondary" onclick="refreshAllCcKeys()">↻ 全部刷新</button>
        </div>
        <div class="key-grid" id="cc-keys-grid"></div>
      </div>
    </div>

    <!-- ═══ 请求日志 ═══ -->
    <div class="tab-content" id="tab-logs">
      <div class="card">
        <div class="card-header">
          <h3>请求日志</h3>
        </div>
        <div class="filter-row">
          <select id="log-filter-model"><option value="">全部模型</option></select>
          <select id="log-filter-status">
            <option value="">全部状态</option>
            <option value="ok">成功</option>
            <option value="error">失败</option>
          </select>
          <button class="btn-secondary" onclick="loadLogs(1)" style="padding:6px 14px;font-size:12px">搜索</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>时间</th><th>用户</th><th>模型</th><th>输入</th><th>缓存</th><th>输出</th><th>耗时</th><th>状态</th><th>CC Key</th></tr></thead>
            <tbody id="logs-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="logs-pagination"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API = '';
let token = sessionStorage.getItem('token');
let currentUser = null;

// ── 图表实例 ──
let chartCalls = null, chartTokens = null, chartModels = null;
let currentRange = '7d';

// ── API 请求 ──

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/auth/login') { doLogout(); throw new Error('Session expired'); }
  if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

// ── 登录/退出 ──

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    token = data.token;
    sessionStorage.setItem('token', token);
    currentUser = data.user;
    showApp();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  }
}

function doLogout() {
  token = null; currentUser = null;
  sessionStorage.removeItem('token');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('app-page').style.display = 'none';
}

// ── 初始化 ──

async function showApp() {
  if (!currentUser) {
    try {
      const data = await api('/api/auth/me');
      currentUser = data.user;
    } catch { doLogout(); return; }
  }
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app-page').style.display = 'block';
  document.getElementById('nav-username').textContent = currentUser.username;

  loadOverview();
  loadCharts();
  loadKeys();
  loadCcKeys();
  loadLogModels();
}

// ── Tab 切换 ──

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  // 切到日志 tab 时加载数据
  if (tab.dataset.tab === 'logs') loadLogs(1);
});

// ── 图表时间范围切换 ──

document.getElementById('chart-range').addEventListener('click', e => {
  const tab = e.target.closest('.range-tab');
  if (!tab) return;
  document.querySelectorAll('#chart-range .range-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentRange = tab.dataset.range;
  loadCharts();
});

// ── 概览统计 ──

async function loadOverview() {
  try {
    const data = await api('/api/dashboard');
    const s = data.stats;
    const todayInput = s.today?.total_input_tokens ?? 0;
    const todayCached = s.today?.total_cached_tokens ?? 0;
    const cacheRate = todayInput > 0 ? ((todayCached / todayInput) * 100).toFixed(1) : '0.0';

    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">今日调用</div>
        <div class="stat-value">${s.today?.total_calls ?? 0}</div>
        <div class="stat-sub">成功 ${s.today?.success_calls ?? 0} · 失败 ${s.today?.error_calls ?? 0}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本周调用</div>
        <div class="stat-value">${fmtNum(s.week?.total_calls)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日输入 Token</div>
        <div class="stat-value">${fmtNum(todayInput)}</div>
        <div class="stat-sub">缓存 ${fmtNum(todayCached)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日输出 Token</div>
        <div class="stat-value">${fmtNum(s.today?.total_output_tokens)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">缓存命中率</div>
        <div class="stat-value">${cacheRate}%</div>
        <div class="stat-sub">cached / input</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本月调用</div>
        <div class="stat-value">${fmtNum(s.month?.total_calls)}</div>
      </div>
    `;
  } catch {}
}

// ── 图表 ──

const CHART_COLORS = ['#4f6ef7','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#6366f1'];

async function loadCharts() {
  let data;
  try { data = await api('/api/admin/charts?range=' + currentRange); }
  catch { return; }

  try { renderPoolHealth(data.poolHealth); } catch(e) { console.warn('poolHealth render error', e); }
  try { renderCallsChart(data.timeSeries || []); } catch(e) { console.warn('calls chart error', e); }
  try { renderTokensChart(data.timeSeries || []); } catch(e) { console.warn('tokens chart error', e); }
  try { renderModelsChart(data.modelDist || []); } catch(e) { console.warn('models chart error', e); }
}

function formatTs(ts, range) {
  const d = new Date(ts);
  if (range === '24h') return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function renderCallsChart(series) {
  const labels = series.map(s => formatTs(s.hour_ts ?? s.day_ts, currentRange));
  const okData = series.map(s => s.ok_calls || 0);
  const errData = series.map(s => s.err_calls || 0);

  if (chartCalls) chartCalls.destroy();
  chartCalls = new Chart(document.getElementById('chart-calls'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '成功', data: okData, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.1)', fill: true, tension: .3, pointRadius: 2 },
        { label: '失败', data: errData, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.1)', fill: true, tension: .3, pointRadius: 2 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: { y: { beginAtZero: true, ticks: { font: { size: 11 } } }, x: { ticks: { font: { size: 10 }, maxRotation: 0 } } },
      interaction: { mode: 'index', intersect: false },
    },
  });
}

function renderTokensChart(series) {
  const labels = series.map(s => formatTs(s.hour_ts ?? s.day_ts, currentRange));
  const inData = series.map(s => s.input_tokens || 0);
  const cachedData = series.map(s => s.cached_tokens || 0);
  const outData = series.map(s => s.output_tokens || 0);

  if (chartTokens) chartTokens.destroy();
  chartTokens = new Chart(document.getElementById('chart-tokens'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: '输入', data: inData, backgroundColor: 'rgba(79,110,247,.7)', borderRadius: 3 },
        { label: '缓存', data: cachedData, backgroundColor: 'rgba(16,185,129,.6)', borderRadius: 3 },
        { label: '输出', data: outData, backgroundColor: 'rgba(139,92,246,.7)', borderRadius: 3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        y: { beginAtZero: true, stacked: true, ticks: { font: { size: 11 }, callback: v => fmtNum(v) } },
        x: { stacked: true, ticks: { font: { size: 10 }, maxRotation: 0 } },
      },
    },
  });
}

function renderModelsChart(dist) {
  if (!dist || dist.length === 0) {
    if (chartModels) chartModels.destroy();
    chartModels = null;
    return;
  }
  const labels = dist.map(d => d.model.split('/').pop());
  const data = dist.map(d => d.calls);

  if (chartModels) chartModels.destroy();
  chartModels = new Chart(document.getElementById('chart-models'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: CHART_COLORS.slice(0, labels.length), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 }, padding: 8 } } },
      cutout: '55%',
    },
  });
}

function renderPoolHealth(ph) {
  if (!ph) return;
  document.getElementById('pool-health-wrap').innerHTML = `
    <div class="pool-item"><div class="pool-num accent">${ph.total}</div><div class="pool-lbl">总数</div></div>
    <div class="pool-item"><div class="pool-num green">${ph.active}</div><div class="pool-lbl">正常</div></div>
    <div class="pool-item"><div class="pool-num yellow">${ph.exhausted}</div><div class="pool-lbl">超限</div></div>
    <div class="pool-item"><div class="pool-num red">${ph.error}</div><div class="pool-lbl">异常</div></div>
    <div class="pool-item"><div class="pool-num accent">${ph.totalInflight}</div><div class="pool-lbl">在途请求</div></div>
  `;
}

// ── 用户 API Key ──

async function loadKeys() {
  try {
    const data = await api('/api/auth/keys');
    const tbody = document.getElementById('keys-tbody');
    const keys = data.keys || [];
    if (keys.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无 API Key，点击上方按钮创建</td></tr>';
      return;
    }
    tbody.innerHTML = keys.map(k => `
      <tr>
        <td>${esc(k.name)}</td>
        <td class="mono">${esc(k.key_prefix)}…</td>
        <td>${k.total_calls}</td>
        <td>${fmtTime(k.created_at)}</td>
        <td><button class="btn-sm danger" onclick="deleteKey(${k.id})">删除</button></td>
      </tr>
    `).join('');
  } catch {}
}

async function createKey() {
  const name = document.getElementById('key-name-input').value.trim();
  try {
    const data = await api('/api/auth/keys', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('new-key-value').textContent = data.key;
    document.getElementById('new-key-banner').style.display = 'block';
    document.getElementById('key-name-input').value = '';
    toast('API Key 创建成功');
    await loadKeys();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteKey(id) {
  if (!confirm('确定删除此 Key？')) return;
  try { await api('/api/auth/keys/' + id, { method: 'DELETE' }); toast('已删除'); await loadKeys(); }
  catch (e) { toast(e.message, 'error'); }
}

// ── CC Key 池 ──

async function loadCcKeys() {
  try {
    await loadTimezones();
    const data = await api('/api/admin/cc-keys');
    const grid = document.getElementById('cc-keys-grid');
    const keys = data.keys || [];
    if (keys.length === 0) {
      grid.innerHTML = '<div class="empty-state">暂无 CC Key，请添加</div>';
      return;
    }
    grid.innerHTML = keys.map(renderCcKey).join('');
  } catch {}
}

function renderCcKey(k) {
  const fh = k.credits?.fiveHour;
  const wk = k.credits?.weekly;
  const usage = k.detail?.usage;
  const planTag = k.plan?.name ? `<span style="color:var(--accent);font-weight:500">${esc(k.plan.name)}</span>` : '';

  return `
    <div class="key-card">
      <div class="key-head">
        <div class="key-head-left">
          <div class="label-edit">
            <span class="key-label">${esc(k.label || k.maskedKey)}</span>
            <button class="btn-edit-label" onclick="editCcLabel(${k.id}, this)" title="编辑备注">✎</button>
          </div>
          <span class="badge ${k.status}">${k.status === 'active' ? '正常' : k.status === 'error' ? '异常' : k.status === 'exhausted' ? '超限' : k.status}</span>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn-sm" onclick="refreshCcKey(${k.id})">刷新</button>
          <button class="btn-sm danger" onclick="deleteCcKey(${k.id})">删除</button>
        </div>
      </div>
      <div class="key-sub">${esc(k.maskedKey)}${k.userName ? ' · ' + esc(k.userName) : ''}${planTag ? ' · ' + planTag : ''}</div>

      ${fh ? renderWindow('5 小时窗口', fh) : ''}
      ${wk ? renderWindow('每周窗口', wk) : ''}
      ${k.credits?.monthlyLeft != null ? renderMonthly(k) : ''}
      ${k.lastError ? `<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ ${esc(k.lastError.slice(0, 120))}</div>` : ''}

      ${usage ? `
        <div class="usage-grid">
          <div class="usage-item"><div class="usage-num">${fmtNum(usage.totalCount)}</div><div class="usage-label">总请求</div></div>
          <div class="usage-item"><div class="usage-num">${fmtNum(usage.totalTokensIn)}</div><div class="usage-label">输入 Token</div></div>
          <div class="usage-item"><div class="usage-num">${fmtNum(usage.totalTokensOut)}</div><div class="usage-label">输出 Token</div></div>
        </div>
      ` : ''}

      <div class="dispatch-section">
        <div class="dispatch-title" onclick="toggleDispatch(${k.id})">
          <span class="arrow" id="dispatch-arrow-${k.id}">▶</span>
          调度 & 指纹
        </div>
        <div class="dispatch-body" id="dispatch-body-${k.id}">
          <div class="dispatch-row">
            <label>权重</label>
            <input type="number" id="dp-priority-${k.id}" value="${k.priority}" min="1" max="100" title="1-100，越大越优先">
          </div>
          <div class="dispatch-row">
            <label>最大并发</label>
            <input type="number" id="dp-concurrent-${k.id}" value="${k.maxConcurrent}" min="0" max="999" title="0 = 不限">
          </div>
          <div class="dispatch-row">
            <label>时区</label>
            <select id="dp-tz-${k.id}">${renderTzOptions(k.timezoneOverride)}</select>
          </div>
          <button class="btn-save-dispatch" onclick="saveDispatch(${k.id})">保存调度参数</button>
          ${k.device ? `
            <div class="device-section">
              <div class="device-title">🖥 设备指纹</div>
              <dl class="device-grid">
                <dt>主机名</dt><dd>${esc(k.device.hostname)}</dd>
                <dt>CPU</dt><dd>${esc(k.device.cpu)}</dd>
                <dt>核心</dt><dd>${k.device.cores}</dd>
                <dt>内存</dt><dd>${k.device.memGiB} GB</dd>
                <dt>时区</dt><dd>${esc(k.device.timezone)}</dd>
                <dt>网卡数</dt><dd>${k.device.macCount}</dd>
              </dl>
            </div>
          ` : ''}
        </div>
      </div>

      <div class="key-footer">
        <span>在途: ${k.currentInflight} · 权重: ${k.priority}</span>
        <span>更新: ${k.lastChecked ? fmtTime(k.lastChecked) : '未检查'}</span>
      </div>
    </div>
  `;
}

function renderMonthly(k) {
  const left = k.credits.monthlyLeft ?? 0;
  const total = k.detail?.monthlyCredits;
  if (total && total > 0) {
    const used = Math.max(0, total - left);
    const pct = Math.min(100, (used / total) * 100);
    const cls = pct >= 90 ? 'red' : pct >= 50 ? 'yellow' : 'green';
    return `<div class="quota-section"><div class="quota-row"><span class="quota-label">月额度</span><span class="quota-value">${used} / ${total}</span></div><div class="progress-bar"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
  }
  return `<div class="quota-row" style="margin-top:8px"><span class="quota-label">月余额</span><span class="quota-value">${left}</span></div>`;
}

function renderWindow(name, w) {
  if (!w) return '';
  const pct = w.cap > 0 ? Math.min(100, (w.used / w.cap) * 100) : 0;
  const cls = pct >= 90 ? 'red' : pct >= 50 ? 'yellow' : 'green';
  return `<div class="quota-section"><div class="quota-row"><span class="quota-label">${name}</span><span class="quota-value">${w.used ?? 0} / ${w.cap ?? 0}</span></div><div class="progress-bar"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}

// ── CC Key 标签编辑 ──

function editCcLabel(id, btn) {
  const labelSpan = btn.previousElementSibling;
  const oldLabel = labelSpan.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = oldLabel;
  input.style.cssText = 'font-size:14px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;outline:none;width:140px;';
  labelSpan.replaceWith(input);
  btn.style.display = 'none';
  input.focus();
  input.select();

  const save = async () => {
    const newLabel = input.value.trim();
    if (newLabel && newLabel !== oldLabel) {
      try {
        await api('/api/admin/cc-keys/' + id, { method: 'PATCH', body: JSON.stringify({ label: newLabel }) });
        toast('备注已更新');
      } catch (e) { toast(e.message, 'error'); }
    }
    await loadCcKeys();
  };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = oldLabel; input.blur(); } });
}

// ── 时区选项缓存 ──

let timezoneOptions = null;

async function loadTimezones() {
  if (timezoneOptions) return;
  try { const data = await api('/api/admin/timezones'); timezoneOptions = data.timezones || ['']; }
  catch { timezoneOptions = ['']; }
}

function renderTzOptions(selected) {
  const tzs = timezoneOptions || [''];
  return tzs.map(tz => `<option value="${esc(tz)}" ${tz === (selected || '') ? 'selected' : ''}>${tz || '自动（按 Key 哈希）'}</option>`).join('');
}

function toggleDispatch(id) {
  const body = document.getElementById('dispatch-body-' + id);
  const arrow = document.getElementById('dispatch-arrow-' + id);
  const isOpen = body.classList.toggle('open');
  arrow.classList.toggle('open', isOpen);
}

async function saveDispatch(id) {
  const priority = Number(document.getElementById('dp-priority-' + id).value);
  const maxConcurrent = Number(document.getElementById('dp-concurrent-' + id).value);
  const timezoneOverride = document.getElementById('dp-tz-' + id).value;
  const btn = event?.target;
  if (btn) setBtnLoading(btn, true);
  try {
    await api('/api/admin/cc-keys/' + id + '/dispatch', { method: 'PATCH', body: JSON.stringify({ priority, maxConcurrent, timezoneOverride }) });
    toast('调度参数已更新');
    await loadCcKeys();
  } catch (e) { toast(e.message, 'error'); }
  finally { if (btn) setBtnLoading(btn, false, '保存调度参数'); }
}

async function addCcKey() {
  const key = document.getElementById('cc-key-input').value.trim();
  const label = document.getElementById('cc-label-input').value.trim();
  if (!key) { toast('请输入 CC Key', 'error'); return; }
  const btn = document.querySelector('#tab-cc-pool .btn-action');
  setBtnLoading(btn, true);
  try {
    await api('/api/admin/cc-keys', { method: 'POST', body: JSON.stringify({ key, label }) });
    document.getElementById('cc-key-input').value = '';
    document.getElementById('cc-label-input').value = '';
    toast('CC Key 添加成功');
    await loadCcKeys();
  } catch (e) { toast(e.message, 'error'); }
  finally { setBtnLoading(btn, false, '+ 添加'); }
}

async function refreshCcKey(id) {
  const btn = event?.target;
  if (btn) setBtnLoading(btn, true);
  try {
    await api('/api/admin/cc-keys/refresh', { method: 'POST', body: JSON.stringify({ id }) });
    toast('已刷新');
    await loadCcKeys();
  } catch (e) { toast(e.message, 'error'); }
}

async function refreshAllCcKeys() {
  const btn = document.querySelector('#tab-cc-pool .btn-secondary');
  setBtnLoading(btn, true);
  try {
    await api('/api/admin/cc-keys/refresh', { method: 'POST', body: JSON.stringify({}) });
    toast('全部刷新完成');
    await loadCcKeys();
  } catch (e) { toast(e.message, 'error'); }
  finally { setBtnLoading(btn, false, '↻ 全部刷新'); }
}

async function deleteCcKey(id) {
  if (!confirm('确定删除此 CC Key？')) return;
  try { await api('/api/admin/cc-keys/' + id, { method: 'DELETE' }); toast('已删除'); await loadCcKeys(); }
  catch (e) { toast(e.message, 'error'); }
}

// ── 请求日志 ──

let logPage = 1;

async function loadLogModels() {
  try {
    const data = await api('/api/admin/logs/models');
    const sel = document.getElementById('log-filter-model');
    (data.models || []).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      sel.appendChild(opt);
    });
  } catch {}
}

async function loadLogs(page) {
  logPage = page || 1;
  const model = document.getElementById('log-filter-model').value;
  const status = document.getElementById('log-filter-status').value;
  const params = new URLSearchParams({ page: logPage, limit: 30 });
  if (model) params.set('model', model);
  if (status) params.set('status', status);

  try {
    const data = await api('/api/admin/logs?' + params);
    const tbody = document.getElementById('logs-tbody');
    const logs = data.logs || [];
    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty-state">暂无记录</td></tr>';
      document.getElementById('logs-pagination').innerHTML = '';
      return;
    }
    tbody.innerHTML = logs.map(l => `
      <tr>
        <td style="white-space:nowrap">${fmtTime(l.created_at)}</td>
        <td>${esc(l.username || '-')}</td>
        <td style="font-size:12px">${esc(l.model || '-')}</td>
        <td>${fmtNum(l.input_tokens)}</td>
        <td>${fmtNum(l.cached_tokens)}</td>
        <td>${fmtNum(l.output_tokens)}</td>
        <td>${l.latency_ms ? (l.latency_ms / 1000).toFixed(1) + 's' : '-'}</td>
        <td><span class="status-dot ${l.status}"></span>${l.status}</td>
        <td style="font-size:12px;color:var(--text-dim)">${esc(l.cc_label || '-')}</td>
      </tr>
    `).join('');

    const pg = document.getElementById('logs-pagination');
    pg.innerHTML = `
      <button onclick="loadLogs(${logPage - 1})" ${logPage <= 1 ? 'disabled' : ''}>← 上一页</button>
      <span>${logPage} / ${data.totalPages || 1}</span>
      <button onclick="loadLogs(${logPage + 1})" ${logPage >= data.totalPages ? 'disabled' : ''}>下一页 →</button>
    `;
  } catch {}
}

// ── Toast 通知 ──

function toast(msg, type = 'success', duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = (type === 'success' ? '✓ ' : type === 'error' ? '✕ ' : 'ℹ ') + msg;
  container.appendChild(el);
  setTimeout(() => { el.classList.add('fadeout'); setTimeout(() => el.remove(), 200); }, duration);
}

// ── 工具函数 ──

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function fmtTime(ts) { return ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '-'; }
function fmtNum(n) {
  if (n == null) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function setBtnLoading(btn, loading, originalText) {
  if (loading) { btn.dataset.origText = btn.textContent; btn.textContent = '处理中…'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.origText || originalText || '确定'; btn.disabled = false; }
}

// ── 页面加载 ──

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
if (token) { showApp(); }
